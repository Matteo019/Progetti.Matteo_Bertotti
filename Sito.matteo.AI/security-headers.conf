# Included by every location that sets its own add_header (nginx drops inherited ones there)
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src 'self' https://dispensabar.matteobertotti.tech; frame-ancestors 'self'; form-action 'self' mailto: tel:; base-uri 'self'; object-src 'none'" always;
