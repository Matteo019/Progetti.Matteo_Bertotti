# Serves the React build and forwards /api, /mcp and /llms.txt to the FastAPI container.
# Sits behind Nginx Proxy Manager + Cloudflare Tunnel, which terminate HTTPS.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;

    # Behind the proxy nginx only sees http: keep redirects relative so they never point to http://
    absolute_redirect off;

    # One canonical host: www -> apex (avoids "duplicate page without canonical")
    if ($host = www.matteobertotti.tech) {
        return 301 https://matteobertotti.tech$request_uri;
    }

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    include /etc/nginx/snippets/security-headers.conf;

    # ---------- App pages (React routes) ----------
    # Each real page gets its canonical URL written into the HTML, before any JavaScript runs.
    location = / {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
        sub_filter '</head>' '<link rel="canonical" href="https://matteobertotti.tech/"></head>';
        sub_filter_once on;
        try_files /index.html =404;
    }

    location = /privacy {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
        sub_filter '</head>' '<link rel="canonical" href="https://matteobertotti.tech/privacy"></head>';
        sub_filter_once on;
        try_files /index.html =404;
    }

    # Admin panel: reachable, never indexed
    location = /admin {
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files /index.html =404;
    }

    # Old URLs of the static site -> new ones (permanent)
    location = /index.html   { return 301 /; }
    location = /privacy.html { return 301 /privacy; }
    location = /images/CV_MatteoBertotti_AIdev-DataAnalyst_Verona.pdf {
        return 301 /images/CV_MatteoBertotti_AI-SoftwareDeveloper_Verona.pdf;
    }

    # ---------- Backend ----------
    # ^~ stops the regex rules below (e.g. \.webp$) from catching /api/uploads/*.webp
    location ^~ /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        add_header X-Robots-Tag "noindex" always;
        client_max_body_size 6m;
    }

    location = /mcp {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_buffering off;
        add_header X-Robots-Tag "noindex" always;
        client_max_body_size 1m;
    }

    location = /llms.txt {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    # ---------- Static files ----------
    # Vite puts a content hash in every file name under /assets: cache forever
    location ^~ /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    location ~* \.(webp|png|svg|pdf|woff2)$ {
        expires 30d;
        try_files $uri =404;
    }

    location ~* \.(json|txt|xml)$ {
        expires -1;
        try_files $uri =404;
    }

    # Anything else is a real 404 (status 404, React shows the "not found" page)
    location / {
        try_files $uri =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        include /etc/nginx/snippets/security-headers.conf;
        internal;
        add_header X-Robots-Tag "noindex" always;
    }

    # The API being down or restarting: answer quickly instead of hanging the proxy
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        include /etc/nginx/snippets/security-headers.conf;
        internal;
        add_header Retry-After "120" always;
    }
}
