server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Compression
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Security headers (inherited by locations that don't declare add_header)
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # HTML/JSON: always revalidate so deploys show up immediately
    location ~* \.(html|json)$ {
        expires -1;
    }

    # Static assets: long cache (CSS/JS are versioned with ?v=)
    location ~* \.(css|js|woff2|webp|png|svg|pdf)$ {
        expires 30d;
    }
}
