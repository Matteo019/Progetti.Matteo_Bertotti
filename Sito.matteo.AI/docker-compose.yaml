services:
  mio-backend:
    build: .
    container_name: backend-vetrina
    restart: unless-stopped
    # Log a rotazione: al massimo 3 file da 10 MB, poi i più vecchi vengono cancellati
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # NON apriamo porte verso l'esterno (es. 8000:8000), ci pensa Nginx!
    networks:
      - proxy-net

networks:
  proxy-net:
    external: true