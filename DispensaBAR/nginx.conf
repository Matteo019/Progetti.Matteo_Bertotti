server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Security headers. Niente X-Frame-Options: l'app viene mostrata in iframe dal portfolio.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Pagine HTML: sempre rivalidate, così i deploy si vedono subito
    location ~* \.html$ {
        expires -1;
    }

    # Asset di Vite: hanno l'hash nel nome, si possono tenere a lungo
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
