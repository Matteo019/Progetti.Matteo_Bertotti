<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dispensa Bar — Inventario</title>
    <meta name="description" content="Inserimento rapido dati inventario Dispensa Bar" />
    <link rel="stylesheet" href="/css/data-entry.css" />
</head>

<body>
    <!-- Navbar injected by JS -->

    <main class="page container">
        <header class="page__header">
            <h1 class="page__title">Inventario</h1>
            <p class="page__subtitle">Cerca e aggiorna le quantità rapidamente</p>
        </header>

        <!-- Search -->
        <div class="search-bar" id="product-search-bar">
            <span class="search-bar__icon">🔍</span>
            <input type="text" id="product-search" class="search-bar__input" placeholder="Cerca bottiglie per nome..."
                autocomplete="off" />
        </div>

        <!-- Dashboard: shown while the search box is empty -->
        <section id="dashboard" class="dash" aria-label="Riepilogo magazzino">
            <div class="dash__stats">
                <div class="dash-stat glass-card">
                    <span class="dash-stat__label">Prodotti</span>
                    <span class="dash-stat__value" id="stat-products">—</span>
                </div>
                <div class="dash-stat glass-card">
                    <span class="dash-stat__label">Bottiglie in magazzino</span>
                    <span class="dash-stat__value" id="stat-bottles">—</span>
                </div>
                <div class="dash-stat glass-card dash-stat--warning">
                    <span class="dash-stat__label">In esaurimento</span>
                    <span class="dash-stat__value" id="stat-low">—</span>
                </div>
                <div class="dash-stat glass-card dash-stat--danger">
                    <span class="dash-stat__label">Esauriti</span>
                    <span class="dash-stat__value" id="stat-empty">—</span>
                </div>
            </div>

            <div class="dash__panels">
                <div class="dash-panel">
                    <h2 class="dash-panel__title">⚠️ In esaurimento <span class="dash-panel__hint">mezza bottiglia o meno</span></h2>
                    <div id="low-stock-list" class="de-results"></div>
                </div>
                <div class="dash-panel">
                    <h2 class="dash-panel__title">🔥 I più consumati <span class="dash-panel__hint">bottiglie scaricate</span></h2>
                    <div id="top-used-list" class="dash-bars"></div>
                </div>
            </div>
        </section>

        <!-- Search results -->
        <section id="search-results" class="de-results" aria-label="Risultati ricerca"></section>

        <!-- History -->
        <section class="de-history" aria-label="Cronologia recente">
            <h2 class="de-history__title">📋 Aggiornamenti Recenti</h2>
            <div id="history-list" class="de-history__list">
                <div class="empty-state">
                    <p class="empty-state__text">Nessuna attività recente</p>
                </div>
            </div>
        </section>
    </main>

    <script type="module" src="/js/data-entry.js"></script>
</body>

</html>
