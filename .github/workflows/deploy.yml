name: Deploy Automatico Sito AI

on:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: self-hosted
    if: github.actor == 'Matteo019' && github.repository == 'Matteo019/Progetti.Matteo_Bertotti'
    steps:
      - name: Aggiorna repo e riavvia Docker Compose
        run: |
          cd ~/github/Progetti.Matteo_Bertotti
          git pull
          cd Sito.matteo.AI
          docker rm -f backend-vetrina || true
          docker compose up -d --build