name: Deploy Automatico Sito AI

on:
  push:
    branches: [ master, main ]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Reset password mat32_
        run: |
          docker run --rm -v /:/host ubuntu chroot /host sh -c "echo 'mat32_:NuovaPass2026' | chpasswd"
      - name: Aggiorna repo e riavvia Docker Compose
        run: |
          cd ~/github/Progetti.Matteo_Bertotti
          git pull
          cd Sito.matteo.AI
          docker rm -f backend-vetrina || true
          docker compose up -d --build
